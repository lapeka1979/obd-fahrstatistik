name: APK bauen

# Push nur auf main; andere Zweige laufen über ihren Pull Request.
# Vorher lief jeder Push auf einen PR-Zweig doppelt (push + pull_request).
on:
  push:
    branches: [main]
    paths-ignore:
      - '**.md'
  pull_request:
    paths-ignore:
      - '**.md'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
      - name: Tests
        run: chmod +x gradlew && ./gradlew testDebugUnitTest
      - name: APK bauen
        run: ./gradlew assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: obd-fahrstatistik-apk
          path: app/build/outputs/apk/debug/*.apk
          # Standard wären 90 Tage; alte Test-APKs belegen sonst Speicher.
          retention-days: 7
